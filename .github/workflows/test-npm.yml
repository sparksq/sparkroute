name: Test (npm)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  # github.ref is stable across pushes to the same PR (refs/pull/N/merge), so
  # this still cancels a superseded run when you push again — the case where
  # cancelling is the right outcome. It deliberately does NOT collapse the
  # push and pull_request runs of one commit: that duplicate is avoided with
  # ci.push_branches instead, because a cancelled run reports as cancelled
  # rather than as success.
  group: test-npm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-sparkroute:
    name: Test sparkroute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::notice::No package-lock.json; using 'npm install'. Commit a lockfile for reproducible installs."
            npm install
          fi
        working-directory: web

      - name: Build
        run: npm run build --if-present
        working-directory: web

      - name: Type-check
        run: npx --no-install tsc --noEmit
        working-directory: web

      - name: Run tests
        run: npm test --if-present
        working-directory: web

      - name: Verify the embedded admin UI matches web/src
        run: |
          if ! git diff --exit-code -- pkg/adminui/ui; then
            echo "::error::embedded admin UI is stale; build web/ and commit its output."
            exit 1
          fi
        working-directory: .
