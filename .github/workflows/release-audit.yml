name: Release audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.17'
      - name: Install and audit web dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=moderate
      - name: Verify retained dependency notices
        run: python scripts/collect-third-party-notices.py --check
      - name: Verify file licensing
        run: uvx --from reuse==6.2.0 reuse lint
      - name: Scan publication history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts=--all --redact=100 --no-banner
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
