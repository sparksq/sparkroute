# Repository-owned: invoked only after the release's Go, web, and version gates.
name: Publish container

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    if: github.ref_type == 'tag' && github.repository == 'sparksq/sparkroute'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release identity
        id: release
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/build-release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          version, commit = release.identity(Path.cwd())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\ncommit={commit}\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sparksq/sparkroute:${{ steps.release.outputs.version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.commit }}
          cache-from: type=gha,scope=sparkroute
          cache-to: type=gha,mode=max,scope=sparkroute
